<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t">
  <title id="t">CallFirst logo: a ranked list whose top line is calling out</title>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="#0E5E5A"/>
  <g transform="translate(1 5)">
  <!-- ranked list: the first line is the call -->
  <rect x="18" y="26" width="38" height="11" rx="5.5" fill="#FF7A59"/>
  <rect x="18" y="44" width="30" height="9" rx="4.5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="18" y="60" width="22" height="9" rx="4.5" fill="#FFFFFF" opacity="0.55"/>
  <!-- signal arcs from the first line -->
  <path d="M63 24.5 a8 8 0 0 1 0 14" fill="none" stroke="#FF7A59" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M70.5 18.5 a16 16 0 0 1 0 26" fill="none" stroke="#FF7A59" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
